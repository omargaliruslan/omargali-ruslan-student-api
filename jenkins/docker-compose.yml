name: omargali-ruslan-jenkins

services:
  jenkins:
    build: .
    container_name: omargali-ruslan-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
